name: Mattermost Frontend Push Notify (Modern Card)

on:
  push:
    branches:
      - "**"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build commit section
        run: |
          git fetch --depth=100
          COMMITS=$(git log --pretty=format:"%h  %s" ${{ github.event.before }}..${{ github.sha }} | sed ':a;N;$!ba;s/\n/\\n/g')
          echo "COMMITS=$COMMITS" >> $GITHUB_ENV

          COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${GITHUB_EVENT_BEFORE}...${GITHUB_SHA}"
          echo "COMPARE_URL=$COMPARE_URL" >> $GITHUB_ENV

      - name: Send modern card to Mattermost
        run: |
          MESSAGE="FRONT • ${GITHUB_REF_NAME}\n${GITHUB_REPOSITORY}\nby ${GITHUB_ACTOR}\n────────────────────────────────\n${COMMITS}\n────────────────────────────────\nCompare: ${COMPARE_URL}"

          curl -X POST -H "Content-Type: application/json" \
          -d "{
            \"attachments\": [
              {
                \"color\": \"#34A853\",
                \"title\": \"Frontend Push\",
                \"text\": \"${MESSAGE}\"
              }
            ]
          }" \
          https://meeting.ssafy.com/hooks/3yhmy8s3ptbb5pq6egcb4z5bfa
